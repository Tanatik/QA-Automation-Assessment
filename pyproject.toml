[tool.ruff]
target-version = "py39"
# 1. Enable flake8-bugbear (`B`) rules, in addition to the defaults.
select = ["E", "F", "W", "TCH", "B", "S", "C4", "DTZ", "EM", "SIM", "ERA"]

# 2. Avoid enforcing line-length violations (`E501`)
ignore = ["E501", "E731", "S101"]

[tool.ruff.mccabe]
max-complexity = 10